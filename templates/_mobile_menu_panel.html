<!-- Mobile nav drawer -- slides in from the right, styled with the site's
     existing theme tokens (not a hardcoded color scheme) so it matches
     light/dark mode automatically. Must be included right before </body>,
     as a sibling of <nav>, never nested inside it -- see the comment in
     _lead_form_modal.html for why (nav's backdrop-blur-md breaks
     position:fixed for descendants). -->
<div id="mobileMenuOverlay" class="hidden fixed inset-0 z-[110] bg-black/50">
  <aside id="mobileMenuPanel" class="absolute top-0 right-0 h-full w-72 max-w-[85vw] bg-[var(--color-card)] border-l border-[var(--color-border)] shadow-2xl flex flex-col transition-colors">
    <div class="flex items-center justify-between px-5 py-4 border-b border-[var(--color-border)]">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="GiftCityFunds" class="h-8 w-auto">
      <button type="button" id="mobileMenuClose" aria-label="Close menu" class="text-[var(--color-text-subtle)] hover:text-[var(--color-text)] transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <ul class="flex-1 overflow-y-auto py-2 text-sm font-bold text-[var(--color-text-muted)]">
      <li><a href="/" class="block px-5 py-3 transition-colors {{ 'text-blue-500 bg-blue-500/5' if request.path == '/' else 'hover:text-blue-500 hover:bg-[var(--color-card-hover)]' }}">Dashboard</a></li>
      <li><a href="/gift-city-outbound" class="block px-5 py-3 transition-colors {{ 'text-blue-500 bg-blue-500/5' if request.path == '/gift-city-outbound' else 'hover:text-blue-500 hover:bg-[var(--color-card-hover)]' }}">Outbound Funds</a></li>
      <li><a href="/gift-city-inbound" class="block px-5 py-3 transition-colors {{ 'text-blue-500 bg-blue-500/5' if request.path == '/gift-city-inbound' else 'hover:text-blue-500 hover:bg-[var(--color-card-hover)]' }}">Inbound Funds</a></li>
      <li><a href="/#performance" class="block px-5 py-3 transition-colors hover:text-blue-500 hover:bg-[var(--color-card-hover)]">Returns Comparison</a></li>
      <li><a href="/insights" class="block px-5 py-3 transition-colors {{ 'text-blue-500 bg-blue-500/5' if request.path.startswith('/insights') else 'hover:text-blue-500 hover:bg-[var(--color-card-hover)]' }}">Insights</a></li>
      <li><a href="/events" class="block px-5 py-3 transition-colors {{ 'text-blue-500 bg-blue-500/5' if request.path == '/events' else 'hover:text-blue-500 hover:bg-[var(--color-card-hover)]' }}">Events</a></li>
      <li class="px-5 pt-3 pb-1 text-[10px] font-extrabold uppercase tracking-widest text-[var(--color-text-subtle)]">More</li>
      <li><a href="/market-intelligence" class="block px-5 py-3 transition-colors {{ 'text-blue-500 bg-blue-500/5' if request.path == '/market-intelligence' else 'hover:text-blue-500 hover:bg-[var(--color-card-hover)]' }}">Market Intelligence</a></li>
      <li><a href="/knowledge-hub" class="block px-5 py-3 transition-colors {{ 'text-blue-500 bg-blue-500/5' if request.path == '/knowledge-hub' else 'hover:text-blue-500 hover:bg-[var(--color-card-hover)]' }}">Knowledge Hub</a></li>
    </ul>

    <div class="border-t border-[var(--color-border)] p-4 space-y-2 shrink-0">
      <button type="button" id="mobileMenuTalkToExpert" class="w-full inline-flex items-center justify-center gap-1.5 py-2.5 rounded-xl text-xs font-bold text-white bg-blue-600 hover:bg-blue-500 transition-colors">
        Talk to an Expert
      </button>
      <div class="grid grid-cols-2 gap-2">
        <a href="tel:+917009648426" class="inline-flex items-center justify-center gap-1.5 py-2.5 rounded-xl border border-[var(--color-border)] text-xs font-bold text-[var(--color-text-muted)] hover:text-blue-500 hover:border-blue-500/40 transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
          Call
        </a>
        <a href="mailto:giftcityfunds@gmail.com" class="inline-flex items-center justify-center gap-1.5 py-2.5 rounded-xl border border-[var(--color-border)] text-xs font-bold text-[var(--color-text-muted)] hover:text-blue-500 hover:border-blue-500/40 transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          Email
        </a>
      </div>
    </div>
  </aside>
</div>

<script>
  (function () {
    var openBtn = document.getElementById('mobileMenuBtn');
    var overlay = document.getElementById('mobileMenuOverlay');
    var closeBtn = document.getElementById('mobileMenuClose');
    var talkBtn = document.getElementById('mobileMenuTalkToExpert');
    if (!openBtn || !overlay) return;

    function open() { overlay.classList.remove('hidden'); }
    function close() { overlay.classList.add('hidden'); }

    openBtn.addEventListener('click', open);
    if (closeBtn) closeBtn.addEventListener('click', close);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });

    // Reuses the existing desktop "Talk to an Expert" modal (see
    // _lead_form_modal.html) rather than duplicating its logic -- just
    // closes this drawer and forwards the click to that trigger.
    if (talkBtn) {
      talkBtn.addEventListener('click', function () {
        close();
        var desktopTrigger = document.getElementById('leadFormBtn');
        if (desktopTrigger) desktopTrigger.click();
      });
    }
  })();
</script>
